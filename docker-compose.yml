version: '3.8'

services:
  spring-batch-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: spring-batch-demo:latest
    container_name: spring-batch-demo-container
    ports:
      - '8080:8080'
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=docker
    # volumes:
    # 如果需要挂载配置文件或日志目录，可以取消注释下面的行
    # - ./logs:/app/logs
    # - ./config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/actuator/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
